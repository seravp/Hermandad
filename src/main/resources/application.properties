spring.application.name=gestion-hermandad
server.port=${SERVER_PORT:8081}
spring.profiles.default=local

# Local legacy databases keep their existing Hibernate workflow until explicitly adopted.
# prod/docker and tests opt in below; never baseline an unknown database on startup.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
